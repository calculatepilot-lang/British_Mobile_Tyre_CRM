<!--
BMT — Click-to-Call + Lead Form + WhatsApp Redirect tracking
==============================================================
Install as ONE WPCode snippet: type "HTML Snippet", location
"Site Wide Footer".

DEBUG BUILD: this version adds console.log('[BMT tracking]', ...) tracing
at every step, added after the WhatsApp redirect was reported as not
happening despite: the tracking snippet confirmed active, LiteSpeed cache
purged, the form's real class/data-form_id confirmed matching the
selector exactly, and AJAX submission confirmed happening (admin-ajax.php
returned 200 in a Network-tab check). None of those checks explained the
missing redirect, so this build traces the actual execution path via the
Console tab instead of guessing further.

Once the cause is found from the console output, remove these logs.

VERIFIED before writing this:
- Fluent Form 3's actual field names, queried directly from the live
  database: input_text (Postcode), input_text_1 (Tyre size),
  input_text_2 (Phone number), input_text_3 (Vehicle registration),
  checkbox[] (Locking nut available?), dropdown (Vehicle Type, converted
  from a radio group by hand in the Fluent Forms editor).
- The rendered form's actual class/attributes, fetched live:
  class="frm-fluent-form ..." data-form_id="3" — exact match to this
  script's selector and LEAD_FORM_ID.
- Fluent Form 3's current confirmation setting: redirectTo="samePage",
  samePageFormBehavior="hide_form" (AJAX-based behavior, confirming AJAX
  submission is active for this form).
- The fluentform_submission_success jQuery event name/signature, cross-
  checked against Fluent Forms' own official developer documentation.
- AW-18394103339 and all three conversion labels are the exact real
  values from Google Ads' own event snippets / Tag Assistant.
-->
<script>
(function () {
  'use strict';

  var LOG_PREFIX = '[BMT tracking]';
  console.log(LOG_PREFIX, 'script loaded');

  var AW_ID = 'AW-18394103339';
  var LEAD_FORM_LABEL = AW_ID + '/gaUBCLTDn-0cEKv8_sJE';
  var WHATSAPP_LABEL = AW_ID + '/2n2iCPmJlu0cEKv8_sJE';
  var CLICK_TO_CALL_LABEL = AW_ID + '/DSwNCNPHn-0cEKv8_sJE';

  var WHATSAPP_NUMBER = '443301226797';
  var LEAD_FORM_ID = '3'; // Fluent Form "Check Fitter Availability" — the shared form used site-wide

  function fireConversion(sendTo, callback) {
    console.log(LOG_PREFIX, 'fireConversion called for', sendTo, 'gtag available:', typeof gtag === 'function');
    if (typeof gtag !== 'function') {
      if (callback) callback();
      return;
    }
    var called = false;
    function safeCallback() {
      if (called) return;
      called = true;
      console.log(LOG_PREFIX, 'safeCallback firing for', sendTo);
      if (callback) callback();
    }
    gtag('event', 'conversion', { send_to: sendTo, event_callback: safeCallback });
    setTimeout(safeCallback, 1000);
  }

  // 1. Click to Call — any phone link, anywhere on the site.
  document.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('a[href^="tel:"]') : null;
    if (!link) return;
    console.log(LOG_PREFIX, 'tel link clicked:', link.href);
    fireConversion(CLICK_TO_CALL_LABEL, function () {});
  }, true);

  // 2. Lead Form Submitted + WhatsApp redirect with real field values.
  function whenjQueryReady(callback) {
    if (window.jQuery) {
      console.log(LOG_PREFIX, 'jQuery is ready, version:', window.jQuery.fn.jquery);
      callback(window.jQuery);
    } else {
      setTimeout(function () { whenjQueryReady(callback); }, 50);
    }
  }

  whenjQueryReady(function ($) {
    // Bind DIRECTLY on each matching form element, not via delegation
    // from document. Every documented working example of this event
    // does the same — $form.on('fluentform_submission_success', ...) —
    // never $(document).on('fluentform_submission_success', selector,
    // ...). An earlier version of this script used delegation and the
    // event never fired in testing (confirmed live: form submitted
    // successfully, lead reached the CRM, but the console never logged
    // "FIRED") — Fluent Forms' custom event apparently doesn't bubble
    // to document the way delegation requires, so direct binding is the
    // only pattern anyone has documented as actually working.
    var $forms = $('form.frm-fluent-form');
    console.log(LOG_PREFIX, 'found', $forms.length, 'matching form(s) to bind directly');
    $forms.each(function () {
      var $form = $(this);
      var formId = $form.data('form_id') || $form.attr('data-form_id');
      console.log(LOG_PREFIX, 'binding directly on form with data-form_id:', formId);
      if (String(formId) !== LEAD_FORM_ID) {
        console.log(LOG_PREFIX, 'form_id mismatch — not binding on this one');
        return;
      }

      $form.on('fluentform_submission_success', function () {
        console.log(LOG_PREFIX, 'fluentform_submission_success FIRED');

      fireConversion(LEAD_FORM_LABEL, function () {});

      var postcode = ($form.find('[name="input_text"]').val() || '').trim();
      var tyreSize = ($form.find('[name="input_text_1"]').val() || '').trim();
      var phone = ($form.find('[name="input_text_2"]').val() || '').trim();
      var vehicleReg = ($form.find('[name="input_text_3"]').val() || '').trim();
      var vehicleType = ($form.find('[name="dropdown"]').val() || '').trim();
      var lockingNut = $form.find('[name="checkbox[]"]:checked')
        .map(function () { return this.value; }).get().join(', ') || 'Not specified';

      console.log(LOG_PREFIX, 'field values:', { postcode: postcode, tyreSize: tyreSize, phone: phone, vehicleReg: vehicleReg, vehicleType: vehicleType, lockingNut: lockingNut });

      var lines = [
        'New tyre enquiry from ' + window.location.href,
        'Postcode: ' + (postcode || 'Not provided'),
        'Tyre size: ' + (tyreSize || 'Not provided'),
        'Vehicle type: ' + (vehicleType || 'Not specified'),
        'Vehicle registration: ' + (vehicleReg || 'Not provided'),
        'Locking nut available: ' + lockingNut,
        'Phone: ' + (phone || 'Not provided'),
      ];
      var whatsappUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
      console.log(LOG_PREFIX, 'whatsappUrl built:', whatsappUrl);

      var redirected = false;
      function goToWhatsApp() {
        if (redirected) return;
        redirected = true;
        console.log(LOG_PREFIX, 'REDIRECTING NOW to', whatsappUrl);
        window.location.href = whatsappUrl;
      }

      fireConversion(WHATSAPP_LABEL, goToWhatsApp);
      });
    });
  });
})();
</script>
